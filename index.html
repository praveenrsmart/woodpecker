    <title>Chess Training</title>
    <script>
      // Force old React login / academy routes onto the unified PHP pages.
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        var base = path.indexOf("/wood") === 0 ? "/wood" : "";
        var role = null;
        if (/(^|\/)academy\/login$/.test(path)) role = "academy";
        else if (/(^|\/)(login|register)$/.test(path)) {
          var m = location.search.match(/[?&]role=(student|academy|admin)/);
          role = m ? m[1] : "student";
        }
        if (role) {
          location.replace(base + "/login.php?role=" + role);
          return;
        }
        // Exact /academy (not /academy/openings etc.) must use the new PHP dashboard.
        if (/(^|\/)academy$/.test(path)) {
          location.replace(base + "/academy.php");
          return;
        }
        if (/(^|\/)endgame$/.test(path)) {
          location.replace(base + "/endgame.php" + location.search);
          return;
        }
        if (/(^|\/)endgame\/board$/.test(path)) {
          location.replace(base + "/endgame-board.php" + location.search);
          return;
        }
        if (/(^|\/)opening$/.test(path)) {
          location.replace(base + "/opening.php" + location.search);
          return;
        }
        if (/(^|\/)opening\/board$/.test(path)) {
          location.replace(base + "/opening-board.php" + location.search);
        }
      })();
    </script>

    <script>
      if (location.protocol === "file:") {
        document.getElementById("root").innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:80px auto;padding:24px;line-height:1.6">' +
          "<h1 style=\"margin-top:0\">Open via local server</h1>" +
          "<p>This app cannot run from a file path. Start the PHP dev server, then open:</p>" +
          "<p><strong><a href=\"http://localhost:3001\">http://localhost:3001</a></strong></p>" +
          "<pre style=\"background:#f1f5f9;padding:12px;border-radius:8px;overflow:auto\">php -S localhost:3001 router.php</pre>" +
          "</div>";
        throw new Error("Use http://localhost:3001 instead of opening index.html directly");
      }
    </script>
